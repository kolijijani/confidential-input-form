name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python3 -m py_compile scripts/secret_form.py tests/test_secret_form.py tests/test_e2e.py
      - name: Unit tests
        run: python3 -m unittest -v tests/test_secret_form.py
      - name: End-to-end tests (real socket)
        run: python3 -m unittest -v tests/test_e2e.py
      - name: Install CLI from source
        run: |
          python3 -m pip install --quiet --upgrade pip setuptools wheel
          python3 -m pip install --quiet .
          secret-vault --version
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          python3 -m pip install --quiet ruff==0.17.1
          ruff check scripts tests
      - name: Shell syntax
        run: sh -n install.sh
