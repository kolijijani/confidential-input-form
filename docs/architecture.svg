<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="tv-title tv-desc">
<title id="tv-title">Terminal Vault data flow</title><desc id="tv-desc">An agent creates a task-specific specification, a local one-shot server presents the form, the user submits through a private network, and the value is written to a protected local file without entering chat.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#858894"/></marker></defs>
<rect width="1200" height="360" rx="18" fill="#0c0d12"/>
<text x="56" y="54" fill="#a3e635" font-family="ui-monospace,monospace" font-size="14" font-weight="700" letter-spacing="2">SECURE HANDOFF FLOW</text>
<text x="56" y="84" fill="#e8e7ed" font-family="system-ui,sans-serif" font-size="22" font-weight="700">Secrets bypass chat, model context and tool logs.</text>
<g fill="none" stroke="#858894" stroke-width="2" marker-end="url(#arrow)"><path d="M246 204H320"/><path d="M526 204H600"/><path d="M806 204H880"/></g>
<g font-family="system-ui,sans-serif"><g><rect x="40" y="142" width="206" height="124" rx="10" fill="#15171f" stroke="#30333d"/><text x="62" y="172" fill="#a3e635" font-family="ui-monospace,monospace" font-size="11">01 · AGENT</text><text x="62" y="205" fill="#fff" font-size="17" font-weight="700">Adaptive JSON spec</text><text x="62" y="232" fill="#858894" font-size="13">title · fields · types · target</text></g>
<g><rect x="320" y="142" width="206" height="124" rx="10" fill="#15171f" stroke="#a3e635"/><text x="342" y="172" fill="#a3e635" font-family="ui-monospace,monospace" font-size="11">02 · LOCAL SERVER</text><text x="342" y="205" fill="#fff" font-size="17" font-weight="700">One-time form</text><text x="342" y="232" fill="#858894" font-size="13">random token · single claim</text></g>
<g><rect x="600" y="142" width="206" height="124" rx="10" fill="#15171f" stroke="#30333d"/><text x="622" y="172" fill="#a3e635" font-family="ui-monospace,monospace" font-size="11">03 · USER</text><text x="622" y="205" fill="#fff" font-size="17" font-weight="700">Private submission</text><text x="622" y="232" fill="#858894" font-size="13">localhost · VPN · private LAN</text></g>
<g><rect x="880" y="142" width="280" height="124" rx="10" fill="#26321a" stroke="#a3e635"/><text x="902" y="172" fill="#a3e635" font-family="ui-monospace,monospace" font-size="11">04 · PROTECTED TARGET</text><text x="902" y="205" fill="#fff" font-size="17" font-weight="700">Atomic mode-0600 write</text><text x="902" y="232" fill="#c9d8b5" font-size="13">no chat · no echo · server exits</text></g></g>
<text x="56" y="318" fill="#5f6370" font-family="ui-monospace,monospace" font-size="11">TERMINAL VAULT · LOCAL-FIRST · PYTHON STANDARD LIBRARY ONLY</text>
</svg>
