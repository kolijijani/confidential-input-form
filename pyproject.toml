[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confidential-input-form"
version = "1.1.0"
description = "One-shot local form for handing secrets to AI agents without putting them in chat."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohammad Koliji Jani Bin Azizan" }]
keywords = ["secrets", "security", "ai-agents", "local-first", "tailscale", "form"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/kolijijani/confidential-input-form"
Source = "https://github.com/kolijijani/confidential-input-form"
Issues = "https://github.com/kolijijani/confidential-input-form/issues"

[project.scripts]
confidential-input-form = "secret_form:main"

[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = ["secret_form"]
